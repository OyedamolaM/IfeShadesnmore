services:
  - type: web
    name: ife-shadesnmore
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: VITE_GA_MEASUREMENT_ID
        value: G-XBHX44RCF2
      - key: PG_DISABLE_SSL
        value: false
      - key: FRONTEND_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: VITE_SITE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TRUST_PROXY
        value: 1
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ORDER_ALERT_EMAIL
        sync: false
      - key: CUSTOMER_ORDER_EMAIL_ENABLED
        value: true
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_BASE_URL
        value: https://api.paystack.co
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        value: true
      - key: SMTP_REQUIRE_TLS
        value: false
      - key: SMTP_IGNORE_TLS
        value: false
      - key: SMTP_TLS_REJECT_UNAUTHORIZED
        value: true
      - key: SMTP_DEBUG
        value: false
      - key: MAIL_PROVIDER
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_API_BASE_URL
        value: https://api.resend.com
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_API_BASE_URL
        value: https://api.sendgrid.com
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_FOLDER
        value: ife-shadesnmore
